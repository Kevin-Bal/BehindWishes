name: Déploiement GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Config Firebase publique par conception (sécurisée par les règles Firestore).
          # Déclarée dans Settings > Secrets and variables > Actions > Variables
          # (APIKEY, AUTHDOMAIN, PROJECTID, STORAGEBUCKET, MESSAGINGSENDERID, APPID).
          VITE_FIREBASE_API_KEY: ${{ vars.APIKEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.AUTHDOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.PROJECTID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.STORAGEBUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.MESSAGINGSENDERID }}
          VITE_FIREBASE_APP_ID: ${{ vars.APPID }}
          # Facultatif : App Check (clé de site reCAPTCHA v3).
          VITE_APPCHECK_SITE_KEY: ${{ vars.APPCHECKSITEKEY }}

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  rules:
    name: Tests des règles Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # L'émulateur Firestore tourne sur Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run test:rules

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, rules]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
